<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인물 관계도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light;
--bg:#F7F7F8;--dot:rgba(112,115,124,.3);--panel:#fff;
--ink:#171719;--ink2:rgba(46,47,51,.88);--mut:rgba(55,56,60,.61);--assist:rgba(55,56,60,.28);
--line:rgba(112,115,124,.22);--fill:rgba(112,115,124,.08);--fill2:rgba(112,115,124,.16);
--acc:#0066FF;--acc-ln:rgba(0,102,255,.28);--neg:#FF4242;--neg-t:#CC3535;--ln:#70737C;
--acc-bg:color-mix(in srgb,var(--acc) 8%,var(--panel));
--sh-xs:0 1px 2px -1px rgba(23,23,23,.1);
--sh-sm:0 2px 4px -2px rgba(23,23,23,.06),0 4px 6px -1px rgba(23,23,23,.06);
--sh-md:0 4px 6px -2px rgba(23,23,23,.07),0 10px 15px -3px rgba(23,23,23,.07);
--ease:cubic-bezier(.2,0,0,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F0F10;--dot:rgba(112,115,124,.32);--panel:#212225;--ink:#F7F7F8;--ink2:rgba(194,196,200,.88);--mut:rgba(174,176,182,.61);--assist:rgba(152,155,162,.28);--line:rgba(112,115,124,.32);--acc:#3385FF;--acc-ln:rgba(51,133,255,.4);--neg:#FF6363;--neg-t:#FF6363;--ln:#989BA2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F0F10;--dot:rgba(112,115,124,.32);--panel:#212225;--ink:#F7F7F8;--ink2:rgba(194,196,200,.88);--mut:rgba(174,176,182,.61);--assist:rgba(152,155,162,.28);--line:rgba(112,115,124,.32);--acc:#3385FF;--acc-ln:rgba(51,133,255,.4);--neg:#FF6363;--neg-t:#FF6363;--ln:#989BA2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 14px/20px "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;letter-spacing:.0145em;-webkit-font-smoothing:antialiased}
#cv{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:24px 24px}
#w{position:absolute;left:0;top:0;transform-origin:0 0}
#ln{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:2;pointer-events:none}
#ln line{pointer-events:stroke;cursor:pointer}
.n{position:absolute;cursor:grab}
.n:active{cursor:grabbing}
.c{z-index:1;border:2px solid;border-radius:50%}
.ct{position:absolute;left:0;right:0;text-align:center;font-weight:700;line-height:1.2;pointer-events:none;padding:0 12%;white-space:pre-wrap}
.rz{display:none;position:absolute;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);box-shadow:var(--sh-xs);right:calc(14.64% - 8px);bottom:calc(14.64% - 8px);cursor:nwse-resize}
.c.sel .rz{display:block}
.c.sel{border-style:dashed}
.p{display:flex;align-items:flex-start;gap:14px;width:max-content}
.ptx{padding-top:2px;max-width:280px}
.im{flex:none;width:84px;height:84px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:700;letter-spacing:0;box-shadow:var(--sh-sm),inset 0 0 0 1px rgba(23,23,25,.08)}
.nm{font-size:18px;font-weight:600;line-height:26px;letter-spacing:-.002em;overflow-wrap:anywhere}
.ds{margin-top:2px;color:var(--ink2);font-size:14px;line-height:20px;letter-spacing:.0145em;white-space:pre-wrap;overflow-wrap:anywhere}
.ds:empty{display:none}
.p.sel .im{outline:2px solid var(--acc);outline-offset:3px}
.t{white-space:pre;width:max-content;padding:4px 8px;line-height:1.3;border-radius:8px;min-width:24px}
.t.sel{outline:2px dashed var(--acc)}
.lb{position:absolute;z-index:1000000;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--panel) 90%,transparent);border-radius:8px;padding:3px 10px;font-size:13px;line-height:18px;font-weight:500;letter-spacing:.0145em;color:var(--ink2);white-space:nowrap;cursor:pointer;box-shadow:var(--sh-xs),inset 0 0 0 1px var(--line)}
.lb{transition:opacity .15s}
.lb.ov:not(.sel){opacity:.35}
.lb.sel{background:var(--acc-bg);color:var(--acc);box-shadow:var(--sh-xs),inset 0 0 0 1px var(--acc-ln)}
.lod .ptx,.lod .lb{display:none}
.cm .p{cursor:crosshair}
.p,.t{z-index:3}
.p{transition:opacity .25s}.p.dim{opacity:.18}
.im{transition:transform .15s}.p:hover .im{transform:scale(1.08)}
.c.hot{outline:2px solid var(--acc);outline-offset:3px}
.cm .p.sel2 .im{outline:2px solid var(--acc);outline-offset:3px}
#tb{position:absolute;z-index:2000000;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);display:flex;align-items:center;gap:2px;padding:6px;background:var(--panel);border-radius:16px;box-shadow:var(--sh-md),inset 0 0 0 1px var(--line);overflow-x:auto}
button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;line-height:18px;letter-spacing:.0145em;color:var(--ink2);background:transparent;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap;transition:background-color .15s var(--ease)}
button[hidden]{display:none}
button:hover{background:var(--fill)}
button:active{background:var(--fill2)}
button.on{background:var(--acc-bg);color:var(--acc)}
button.on:hover{background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
button.on:active{background:color-mix(in srgb,var(--acc) 20%,var(--panel))}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#bp,#bh{display:none}
#cv[data-mode=r] .ed,#cv[data-mode=r] .em{display:none}
#cv:not([data-mode=r]) .rd{display:none}
#cv[data-mode=m] .ed{opacity:.35}
#cv[data-mode=r] .n{cursor:default}#cv[data-mode=r] .p{cursor:pointer}
#cv[data-mode=m],#cv[data-mode=m] .n{cursor:grab}
button:disabled{color:var(--assist);background:transparent;cursor:not-allowed}
.ib{padding:9px;justify-content:center}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sp{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
#zl{min-width:44px;text-align:center;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
#ins{display:none;position:absolute;z-index:2000000;right:12px;top:calc(72px + env(safe-area-inset-top,0px));width:248px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border-radius:16px;padding:16px;box-shadow:var(--sh-md),inset 0 0 0 1px var(--line);user-select:text;-webkit-user-select:text}
#ins h3{margin:0 0 12px;font-size:16px;line-height:24px;font-weight:600;letter-spacing:.0057em}
#ins label{display:block;margin-bottom:12px;color:var(--ink2);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.0252em}
#ins input[type=text],#ins textarea,#ins select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:9px 12px;font:inherit;font-size:14px;line-height:20px;letter-spacing:.0145em;color:var(--ink);background:var(--panel);border:0;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s ease}
#ins :is(input[type=text],textarea,select):focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
#ins textarea{min-height:64px;resize:vertical}
#ins input[type=range]{display:block;width:100%;margin-top:8px;accent-color:var(--acc)}
#ins input[type=checkbox]{accent-color:var(--acc)}
#ins input[type=color]{display:block;margin-top:6px;width:44px;height:32px;padding:2px;border:0;border-radius:8px;background:none;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.row button{box-shadow:inset 0 0 0 1px var(--line);padding:7px 14px}
.row .ic{width:16px;height:16px}
.danger{color:var(--neg-t)}
#ins .go{display:block;width:100%;text-align:left;padding:6px 8px;font-size:13px}
#hint{position:absolute;left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;color:var(--mut);font-size:12px;line-height:16px;letter-spacing:.0252em;pointer-events:none;max-width:calc(100% - 28px)}
@media (max-width:640px){#ins{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:45%}#hint{display:none}}
#oc{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.rc{position:absolute;left:0;top:0;pointer-events:none;z-index:1000002;transform-origin:0 0;opacity:0;transition:opacity .2s}
.rcs{position:absolute;left:-2px;top:-1.5px;fill:var(--rc);stroke:#fff;stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.rn{position:absolute;left:14px;top:16px;background:var(--rc);padding:2px 8px;border-radius:8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.0252em;white-space:nowrap;box-shadow:var(--sh-sm)}
.c.rs::after,.t.rs::after,.lb.rs::after,.p.rs .im::after{content:"";position:absolute;pointer-events:none;border:2px solid var(--rc)}
.c.rs::after{inset:-9px;border-radius:50%}
.t.rs::after{inset:-4px;border-radius:10px}
.lb.rs::after{inset:-4px;border-radius:11px}
.p.rs .im{position:relative}
.p.rs .im::after{inset:-8px;border-radius:50%}
#pp{display:flex;align-items:center;padding:0 8px 0 2px}
#pp:empty{display:none}
.pc{flex:none;width:26px;height:26px;margin-left:-6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0;box-shadow:0 0 0 2px var(--panel)}
.pc:first-child{margin-left:0}
.pc.me{cursor:pointer}
.n.tw{transition:left .12s linear,top .12s linear,width .12s linear,height .12s linear,opacity .25s}
.tsb,#tsb{position:fixed;inset:0;z-index:3000000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28)}
.tsm{background:var(--panel);color:var(--ink);border-radius:16px;padding:20px 24px;box-shadow:var(--sh-md),inset 0 0 0 1px var(--line);text-align:center;font-size:14px;line-height:20px;min-width:240px}
.tsm p{margin:0 0 4px}
#ins .tg,#wk .tg{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:13px;color:var(--ink2)}
#ins .tg button,#wk .tg button{padding:4px 6px;font-size:13px}
#ins .eps,#wk .eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:2px 6px;margin:0 0 8px 22px}
#ins .eps label,#wk .eps label{display:flex;gap:4px;align-items:center;margin:0;font-size:12px;overflow-wrap:anywhere}
#wk .wn{display:grid;gap:4px;margin:0 0 10px 8px}
#wk{display:none;position:absolute;z-index:2000000;left:12px;top:calc(72px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border-radius:16px;padding:16px;box-shadow:var(--sh-md),inset 0 0 0 1px var(--line);user-select:text;-webkit-user-select:text}
#wk h3{margin:0 0 12px;font-size:16px;line-height:24px;font-weight:600;letter-spacing:.0057em}
#wk label{display:block;margin-bottom:12px;color:var(--ink2);font-size:12px;line-height:16px}
.wr{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mut)}
#wk input[type=text],#wk input[type=number]{box-sizing:border-box;min-width:0;padding:7px 10px;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:0;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
#wk input[type=text]{flex:1}#wk input[type=number]{width:62px}
#wk input:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
@media (max-width:640px){#wk{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:55%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s),cv=$('#cv'),W=$('#w'),svg=$('#ln'),ins=$('#ins');

/* ---- 문서 동기화 ----
   view(key): 서버 확정 상태 위에 '보내는 중 + 보낼 예정' 변경을 겹친 모습 = 내 화면에 있어야 하는 값 */
function view(key){const b=base.get(key);let d=b&&!b.del?cp(b.data):undefined;
 for(const o of fl.concat(qd)){if(ek(o.k,o.id)!=key)continue;
  if(o.put)d=cp(o.put);else if(o.del)d=undefined;else if(d){(o.rm||[]).forEach(f=>delete d[f]);Object.assign(d,cp(o.set||{}))}}

/* diff(): 내 화면에서 바뀐 것(sh 와 다른 것)을 찾아 대기열에 넣고, 실행 취소 기록에 남김. 동기적으로 끝남 */
function diff(rec=true){if(!ready)return 0;const seen=new Set(),ops=[];
 const scan=(arr,k)=>arr.forEach(o=>{const key=ek(k,o.id),c=ent(o),old=sh.get(key);seen.add(key);
  if(!old){ops.push({k,id:o.id,put:cp(c)});sh.set(key,cp(c));if(rec)hrec(key,undefined,c);return}
  const set={},rm=[];let d=0;for(const f in c)if(!eq(c[f],old[f])){set[f]=cp(c[f]);d=1}for(const f in old)if(!(f in c)){rm.push(f);d=1}
  if(d){const op={k,id:o.id,set};if(rm.length)op.rm=rm;ops.push(op);sh.set(key,cp(c));if(rec)hrec(key,old,c)}});
 scan(S.nodes,'n');scan(S.links,'l');
 [...sh.keys()].forEach(key=>{if(seen.has(key))return;const[k,id]=sp(key);ops.push({k,id,del:true});if(rec)hrec(key,sh.get(key),undefined);sh.delete(key)});
 if(rec&&!GZ.size)hclose();
 if(ops.length)enqueue(ops);return ops.length}
function enqueue(ops){ops.forEach(o=>{const key=ek(o.k,o.id);let last=null;for(let i=qd.length-1;i>=0;i--)if(ek(qd[i].k,qd[i].id)==key){last=qd[i];break}
  if(o.set&&last&&last.set&&!last.put&&!last.del){(o.rm||[]).forEach(f=>{delete last.set[f];if(!(last.rm||[]).includes(f))(last.rm=last.rm||[]).push(f)});for(const f in o.set){last.set[f]=o.set[f];if(last.rm)last.rm=last.rm.filter(x=>x!=f)}}

async function pump(){if(sending||!ready)return;sending=true;
 try{while(qd.length){fl=qd.splice(0,400);let r;try{r=await sb.rpc('apply_ops',{p_room:rid,p_ops:fl})}catch(e){r={error:e}}
   if(r.error){qd=fl.concat(qd);fl=[];fails++;console.warn('apply_ops',r.error);if(fails==3)msg('저장이 지연되고 있어요…');
    if(/not a member/i.test(r.error.message||''))try{await sb.rpc('join_room',{p_room:rid})}catch(e){}
    await new Promise(z=>setTimeout(z,Math.min(8000,400*2**fails)));continue}
   fails=0;const done=fl;fl=[];
    /* 응답이 늦어 그 사이 더 새로운 변경 이벤트가 먼저 왔다면, 보내는 중이던 변경을 새 값 위에 덧씌워 보고 있었으므로 → 응답 후 해당 항목을 반드시 다시 맞춤 */
    ingestMany((r.data||[]).map(x=>({kind:x.k,id:x.id,ver:x.ver,data:x.data,deleted:x.deleted})),done.map(o=>ek(o.k,o.id)))}}

/* 서버에서 온 행(이벤트·응답·재접속 시 전체 불러오기)을 반영. 더 오래된 번호(ver)의 행은 무시 */
function ingestMany(rows,extra){if(!ready)return;diff();const keys=[];
 rows.forEach(r=>{if(!idOk(r.id)||(r.kind!='n'&&r.kind!='l'))return;const key=ek(r.kind,r.id),b=base.get(key),v=+r.ver;if(b&&b.ver>=v)return;const d=r.deleted?null:cleanEnt(r.kind,r.data);base.set(key,{ver:v,data:d||{},del:!d});keys.push(key)});
 (extra||[]).forEach(k=>{if(!keys.includes(k))keys.push(k)});keys.forEach(recon);if(keys.length)uiq()}
const dragging=(k,id)=>k=='n'&&drag&&((drag.n&&drag.n.id==id)||(drag.kids||[]).some(x=>x[0].id==id));
function recon(key){const want=view(key),have=sh.get(key);if(want===undefined&&have===undefined)return;if(want!==undefined&&have!==undefined&&eq(want,have))return;
 const[k,id]=sp(key);if(dragging(k,id))return;
 if(want===undefined){dropLocal(k,id);sh.delete(key)}else{setLocal(k,id,want);sh.set(key,cp(want))}}

function setLocal(k,id,want){const arr=k=='n'?S.nodes:S.links;let n=arr.find(x=>x.id==id);
 if(!n){n={...cp(want),id};arr.push(n);if(k=='n')mk(n);return}
 const moved=k=='n'&&['x','y','w','h'].some(f=>!eq(n[f],want[f]));
 for(const f in want)if(!eq(n[f],want[f]))n[f]=cp(want[f]);
 for(const f in n){if(f=='id'||SKIP.has(f)||f[0]=='_')continue;if(!(f in want))delete n[f]}
 if(k=='n'){upd(n);const e=els[id];if(moved&&e){e.classList.add('tw');clearTimeout(e._tw);e._tw=setTimeout(()=>e.classList.remove('tw'),200)}}}
function dropLocal(k,id){if(k=='n'){S.nodes=S.nodes.filter(x=>x.id!=id);if(els[id]){els[id].remove();delete els[id]}hov=null;Object.values(els).forEach(e=>e.classList.remove('dim'))}
 else{S.links=S.links.filter(x=>x.id!=id);if(lels[id]){lels[id].remove();delete lels[id]}}}

   드래그·패널 입력·정렬처럼 이어지는 동작(제스처)은 끝날 때까지 한 칸으로 묶음. */

function hrec(key,b,a){if(!hcur)hcur=new Map();const c=hcur.get(key);if(c)c.a=cp(a);else hcur.set(key,{b:cp(b),a:cp(a)})}
function hclose(){if(!hcur)return;const e=[];hcur.forEach((c,key)=>{if(!eq(c.b,c.a))e.push({key,b:c.b,a:c.a})});hcur=null;if(e.length){U.push(e);if(U.length>100)U.shift();R.length=0}hs()}
function histMove(d){if(!ready||GZ.size)return;diff();hclose();const st=d<0?U:R,to=d<0?R:U,e=st.pop();if(!e){hs();return}
 e.forEach(c=>{const[k,id]=sp(c.key),from=d<0?c.a:c.b,tgt=d<0?c.b:c.a,have=sh.get(c.key);
  if(tgt===undefined){if(have!==undefined)dropLocal(k,id)}

  else if(have!==undefined){const want=cp(have);new Set([...Object.keys(from),...Object.keys(tgt)]).forEach(f=>{if(eq(from[f],tgt[f]))return;if(f in tgt)want[f]=cp(tgt[f]);else delete want[f]});setLocal(k,id,want)}});
 diff(false);to.push(e);uiq();hs()}

function loadTS(){return new Promise((res,rej)=>{if(window.turnstile)return res();const e=document.createElement('script');e.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';e.async=true;e.onload=()=>res();e.onerror=()=>rej(new Error('captcha: Turnstile 스크립트를 불러오지 못했어요'));document.head.appendChild(e)})}

 return new Promise((res,rej)=>{const box=document.createElement('div');box.id='tsb';box.innerHTML='<div class="tsm"><p>사람인지 확인하고 있어요…</p><div class="tsw"></div></div>';document.body.appendChild(box);let wid,to;
  const end=(f,v)=>{clearTimeout(to);try{turnstile.remove(wid)}catch(e){}box.remove();f(v)};

  if(/no captcha_token|captcha_token/i.test(m))return TS_KEY?'Supabase 가 캡차 증표를 받지 못했어요. Supabase 의 CAPTCHA 제공자가 Turnstile 로 설정돼 있는지 확인해 주세요.':'Supabase 에서 CAPTCHA 보호가 켜져 있는데 Turnstile 사이트 키가 없어요. config.js 의 TS_KEY 에 사이트 키를 넣거나, Supabase 에서 CAPTCHA 보호를 꺼 주세요.';

/* ---- 연결 유지 ----
   모바일은 화면을 끄거나 다른 앱으로 가면 실시간 연결이 끊기고, 서버가 채널을 닫으면(CLOSED) 라이브러리는 자동으로 다시 붙지 않음.
   → 채널이 닫히거나 오래 복구되지 않으면 새 채널을 만들어 다시 연결하고, 돌아왔을 때는 놓친 변경을 다시 불러옴.
